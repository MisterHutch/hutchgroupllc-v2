<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">HutchGroup H mark</title>
<desc id="desc">A geometric H made of two pillars connected by a rising bridge, in mint and sky blue on deep navy.</desc>
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2038"/><stop offset="1" stop-color="#061321"/></linearGradient>
  <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b6e45d"/><stop offset="1" stop-color="#78c94a"/></linearGradient>
  <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#79dce1"/><stop offset="1" stop-color="#4aa9dc"/></linearGradient>
  <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a6dc54"/><stop offset=".52" stop-color="#57cbd1"/><stop offset="1" stop-color="#68b8e8"/></linearGradient>
  <radialGradient id="glow" cx="68%" cy="22%" r="72%"><stop stop-color="#3cc4d0" stop-opacity=".24"/><stop offset="1" stop-color="#3cc4d0" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#020910" flood-opacity=".55"/></filter>
  <filter id="bridgeGlow" x="-30%" y="-50%" width="160%" height="200%"><feDropShadow dx="0" dy="9" stdDeviation="17" flood-color="#42c5cf" flood-opacity=".27"/></filter>
</defs>
<rect x="88" y="88" width="848" height="848" rx="234" fill="url(#tile)" stroke="#a6dce4" stroke-opacity=".16" stroke-width="4" filter="url(#shadow)"/>
<rect x="90" y="90" width="844" height="844" rx="232" fill="url(#glow)"/>
<path d="M196 700c111 82 233 124 366 124 111 0 207-29 288-88" fill="none" stroke="#8dd8df" stroke-opacity=".07" stroke-width="3"/>
<circle cx="722" cy="278" r="196" fill="none" stroke="#8dd8df" stroke-opacity=".055" stroke-width="3"/>
<rect x="292" y="254" width="134" height="516" rx="67" fill="url(#left)"/>
<rect x="598" y="254" width="134" height="516" rx="67" fill="url(#right)"/>
<path d="M394 548 L630 462" fill="none" stroke="url(#bridge)" stroke-width="118" stroke-linecap="round" filter="url(#bridgeGlow)"/>
<path d="M394 528 L628 443" fill="none" stroke="#ffffff" stroke-opacity=".17" stroke-width="12" stroke-linecap="round"/>
</svg>