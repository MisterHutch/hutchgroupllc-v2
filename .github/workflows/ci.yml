name: CI

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 20
            - name: Validate vercel.json
              run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json OK')"
            - name: Verify site entrypoint exists
              run: test -f index.html
            - name: Verify flagship service pages exist
              run: test -f technology-opportunity-audit/index.html && test -f digital-business-systems/index.html && test -f fractional-technology-partner/index.html && test -f opportunity-review/index.html
            - name: Guard approved homepage behavior
              run: node --test scripts/homepage-regression.test.mjs
            - name: Guard Opportunity Review behavior
              run: node --test scripts/opportunity-review-regression.test.mjs
